name: novaui

services:
  frontend:
    container_name: novaui-test
    image: novaui-test:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BUILD_SCRIPT: build:test
    ports:
      - "3001:80"
    env_file:
      - ./.env.test
    environment:
      - NODE_ENV=test
    restart: unless-stopped
